name: Check
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # A new push to a pull request cancels the run for the old commit.
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  pdf:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends latexmk texlive-latex-extra texlive-fonts-recommended texlive-pictures
      - run: latexmk -pdf -interaction=nonstopmode -halt-on-error mru.tex
      # latexmk passes with a missing \ref or \cite. Fail on them here.
      - run: "! grep -E 'LaTeX Warning: (Reference|Citation) .* undefined' mru.log"
      - uses: actions/upload-artifact@v7
        with:
          name: mru-pdf
          path: mru.pdf
          retention-days: 7
